[workspace]
members = ["crates/verse-syntax", "crates/verse-fmt", "crates/verse-cli"]
exclude = ["tests/fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
verse-syntax = { path = "crates/verse-syntax" }
verse-fmt = { path = "crates/verse-fmt" }
rowan = "0.16.1"
stacker = "0.1.23"
unicode-general-category = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.9"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
opt-level = 2
[profile.dev.build-override]
debug = false
[profile.release]
debug = "line-tables-only"
strip = "debuginfo"
