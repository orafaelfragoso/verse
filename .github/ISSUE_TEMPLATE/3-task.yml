name: Task
description: A scoped piece of work with criteria anyone, human or agent, can check.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What exists or works when this is done.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each item is observable, such as a command and its expected output, or a file and what it contains.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Docs sections, files and issues to read first.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related work that must not be done here.
