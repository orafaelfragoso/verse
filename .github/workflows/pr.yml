name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  # The title becomes the squash commit's subject, so it must follow the
  # commit format in CONTRIBUTING.md.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against the commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|test|docs|spec|build|ci|chore'
          scopes='spec|compiler|vm|runtime|std|cli|tooling|packages|plugins|targets'
          pattern="^($types)(\(($scopes)\))?!?: [^ ].*[^. ]$"
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::'$TITLE' does not match <type>(<scope>): <summary>. See CONTRIBUTING.md."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::The title is ${#TITLE} characters; the limit is 72."
            exit 1
          fi

  # Pull requests are labeled like issues, so the type label must agree with
  # the title type. The mapping is in the opening-a-pull-request skill.
  pr-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check the type label against the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case ${TITLE%%[(!:]*} in
            feat) want=feature ;;
            fix) want=bug ;;
            perf) want=perf ;;
            docs) want=docs ;;
            spec) want=design ;;
            *) want=chore ;;
          esac
          found=()
          for label in $LABELS; do
            case $label in
              bug|feature|design|docs|perf|chore) found+=("$label") ;;
              status:*)
                echo "::error::'$label' describes issues; remove it from the pull request."
                exit 1
                ;;
            esac
          done
          if [[ ${#found[@]} -ne 1 || ${found[0]} != "$want" ]]; then
            echo "::error::A '${TITLE%%[(!:]*}' title needs exactly one type label, '$want'; found: ${found[*]:-none}. See CONTRIBUTING.md."
            exit 1
          fi
