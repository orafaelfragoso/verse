name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check-dependencies.py
      - run: python3 tools/spec-coverage.py
      - run: tools/docs/check.sh

  benchmarks:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bench/compiler/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-benchmarks
          path: dist/bench/compiler.json

  benchmark-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare against the committed baseline
        # A small slice so a pull request stays cheap. The comparison gates only
        # when this runner's CPU model and toolchain match the committed
        # baseline; otherwise the run is a measurement, not a gate.
        run: python3 bench/compiler/run.py --sizes 1000 --baseline bench/compiler/baseline.json
